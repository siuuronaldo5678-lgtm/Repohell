
name: Build and Release Flight Simulator APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor
        run: |
          npm install --save-exact @capacitor/core@7 @capacitor/android@7
          npm install --save-dev --save-exact @capacitor/cli@7

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        id: verify_apk
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK not found!"
            find android -name "*.apk"
            exit 1
          fi

          echo "APK verified successfully."
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flight-simulator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release APK
        id: prepare_asset
        run: |
          mkdir -p "${RUNNER_TEMP}/release"

          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ASSET="${RUNNER_TEMP}/release/flight-simulator-debug-${GITHUB_RUN_NUMBER}.apk"

          cp "$APK" "$ASSET"

          test -s "$ASSET"

          echo "asset_path=$ASSET" >> "$GITHUB_OUTPUT"
          echo "asset_name=$(basename "$ASSET")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        id: publish_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="flight-simulator-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          APK="${{ steps.prepare_asset.outputs.asset_path }}"

          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Flight Simulator APK #${GITHUB_RUN_NUMBER}" \
            --notes "Automatically generated Android debug APK.

          Run: ${GITHUB_RUN_NUMBER}
          Commit: ${GITHUB_SHA}

          This is a testing build." \
            --target "$GITHUB_SHA"

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Report build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then

            TAG="flight-simulator-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"

            URL=$(gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json url --jq '.url')

            {
              echo "### Flight Simulator APK Ready"
              echo ""
              echo "- Release: [$URL]($URL)"
              echo "- Artifact: flight-simulator-debug-apk"
            } >> "$GITHUB_STEP_SUMMARY"

          else

            {
              echo "### APK Release Failed"
              echo ""
              echo "Check the previous failed step."
              echo "The Actions artifact may still be available."
            } >> "$GITHUB_STEP_SUMMARY"

          fi
